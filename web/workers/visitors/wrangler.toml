name = "uap-visitors"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Namespace de Workers KV donde se acumulan las cuentas por país.
# Créalo una vez con:
#     npx wrangler kv namespace create VISITS
# y pega el `id` que devuelve en la línea de abajo (reemplaza el placeholder).
[[kv_namespaces]]
binding = "VISITS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
