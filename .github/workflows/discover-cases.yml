name: Discover new UAP cases

# Detector diario de candidatos UAP nuevos. Monitorea fuentes con API
# limpia (arXiv, GitHub repos, Hugging Face datasets) y abre un issue
# con los hallazgos del día.
#
# Diseño:
#   - NO usa LLM. Solo detecta "salió algo nuevo".
#   - El juicio editorial (entra al corpus o no, cómo redactarlo, qué
#     calibración ICD-203) lo hace la rutina cowork sobre el issue que
#     este workflow abre. Ver web/ROUTINE_NEW_CASES.md.
#   - Si el script no encuentra candidatos: no abre issue (cero ruido).
#   - 1 issue por día (consolidado).

on:
  schedule:
    - cron: '0 8 * * *'    # diario, 08:00 UTC (1h después de daily-audit)
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: "discover-cases"
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run discovery
        id: discover
        run: |
          node scripts/discover-new-cases.mjs
          count=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/discover.json')).length)")
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Discovered $count candidates"

      - name: Open issue when candidates found
        if: steps.discover.outputs.count != '0'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const items = JSON.parse(fs.readFileSync('/tmp/discover.json', 'utf8'));
            const today = new Date().toISOString().slice(0, 10);
            const grouped = items.reduce((acc, it) => {
              (acc[it.source] ||= []).push(it);
              return acc;
            }, {});
            const lines = [
              `Detección automática de candidatos UAP en las últimas 30h.`,
              ``,
              `**Total: ${items.length} candidatos** en ${Object.keys(grouped).length} fuentes.`,
              ``,
              `> Este issue es solo una alerta de novedad. El juicio editorial`,
              `> (entra al corpus o no, cómo se redacta, calibración ICD-203)`,
              `> lo hace la rutina diaria de cowork siguiendo el playbook en`,
              `> \`web/ROUTINE_NEW_CASES.md\`. Filtrar el ruido es parte del proceso.`,
              ``,
            ];
            for (const [source, list] of Object.entries(grouped)) {
              lines.push(`## ${source} (${list.length})`);
              lines.push('');
              for (const c of list) {
                lines.push(`- **[${c.title.slice(0, 110)}](${c.url})** · _${c.date}_`);
                if (c.note) lines.push(`  ${c.note.slice(0, 240)}`);
              }
              lines.push('');
            }
            lines.push(
              '',
              `_Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}_`,
            );
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `discover: candidatos UAP (${today})`,
              body: lines.join('\n'),
              labels: ['discover', 'automated'],
            });
