name: Cerebro

# Disparo del cerebro desde GitHub — pensado para el MÓVIL.
#
# Abre en Chrome:
#   https://github.com/dgonzamat/Mercadopublico/actions/workflows/cerebro.yml
# → «Run workflow» → eliges el modo, escribes la señal, y listo. La corrida
# ocurre en el runner, no en tu máquina, y deja un PR draft con lo que cambió.
#
# Es la contraparte remota de `tools/cerebro-panel`: el panel local ve el flujo
# moverse y dispara desde el escritorio; esto dispara desde cualquier navegador.
# Ambos lanzan exactamente el mismo comando —`claude -p "/cerebro <modo>"`— así
# que el cerebro no sabe ni le importa por dónde entró.
#
# REQUISITO ÚNICO: el secreto `ANTHROPIC_API_KEY` en
# Settings → Secrets and variables → Actions. Sin él el job falla en el primer
# paso con un mensaje explícito, en vez de gastar minutos para morir a mitad.

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "Modo"
        type: choice
        required: true
        default: mejoras-ux
        options:
          - caso-nuevo
          - bugs
          - mejoras-ux
          - mejoras-tec
          - frescura
          - noticias
          - diagnostico
      senal:
        description: "Señal — qué debe atacar esta corrida (la regla de oro: sin señal no es un disparo)"
        type: string
        required: false

# Un cerebro a la vez. Dos corridas concurrentes sobre el mismo repo se pisan
# los archivos y producen PRs que se contradicen.
concurrency:
  group: cerebro
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Verificar el secreto antes de gastar minutos
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::Falta el secreto ANTHROPIC_API_KEY."
            echo "Añádelo en Settings → Secrets and variables → Actions y vuelve a lanzar."
            exit 1
          fi

      # `persist-credentials: false`: el cerebro lee contenido externo (noticias,
      # páginas citadas) y una inyección no debe encontrar credenciales de git
      # en el checkout. Solo el último paso empuja, con su propio token.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # El cerebro puede necesitar construir (modos de UI/UX). Las sondas del
      # gate son node-plano y no lo necesitan, pero instalar aquí sale gratis
      # con la caché y evita que la corrida se gaste su tiempo en `npm ci`.
      - name: Dependencias
        working-directory: web
        run: npm ci

      - name: Instalar Claude Code
        # Versión fijada: una versión nueva no entra sin pasar por un PR.
        run: npm i -g @anthropic-ai/claude-code@2.1.296

      - name: Correr el cerebro
        id: correr
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # La clave queda para las llamadas de Claude a la API, pero no llega a
          # los procesos que lanza (Bash, `npm run build`, hooks): un script
          # alterado por una inyección no puede leerla.
          CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
          MODO: ${{ inputs.modo }}
          SENAL: ${{ inputs.senal }}
        run: |
          # `diagnostico` es el modo sin argumento: sondea, elige y gatilla.
          arg="$MODO"
          [ "$arg" = "diagnostico" ] && arg=""

          prompt="/cerebro $arg"
          if [ -n "$SENAL" ]; then
            prompt="$prompt

          Señal recibida desde GitHub Actions (qué debe atacar esta corrida):
          $SENAL"
          fi

          echo "── prompt ──"; echo "$prompt"; echo "────────────"

          # `--permission-mode acceptEdits`: el runner es efímero y aislado, y
          # el cerebro existe para arreglar. Todo lo que toque queda visible en
          # el PR draft, que es donde se revisa.
          claude -p "$prompt" \
            --permission-mode acceptEdits \
            --disallowedTools "Edit(/.github/**)" "Edit(/.claude/**)" \
            --verbose --output-format stream-json < /dev/null \
            | tee /tmp/cerebro-stream.ndjson

      # Los inputs pasan por `env:` y nunca se interpolan en el script: la señal
      # es texto libre y una comilla o un backtick ejecutaría código.
      - name: Resumen de la corrida
        if: always()
        env:
          MODO: ${{ inputs.modo }}
          SENAL: ${{ inputs.senal }}
        run: |
          {
            echo "## Cerebro · \`$MODO\`"
            echo
            if [ -n "$SENAL" ]; then
              echo "**Señal:** $SENAL"
              echo
            fi
            echo "### Herramientas invocadas"
            echo
            node -e '
              const fs = require("fs");
              let n = 0;
              for (const l of fs.readFileSync("/tmp/cerebro-stream.ndjson","utf8").split("\n")) {
                if (!l.trim()) continue;
                let e; try { e = JSON.parse(l) } catch { continue }
                if (e.type === "assistant")
                  for (const b of e.message?.content ?? [])
                    if (b.type === "tool_use")
                      console.log(`- \`${b.name}\` — ${JSON.stringify(b.input).slice(0,140)}`), n++;
                if (e.type === "result")
                  console.log(`\n**${e.subtype}** · ${(e.duration_ms/1000).toFixed(1)}s · ${e.num_turns} turnos` +
                              (e.total_cost_usd != null ? ` · $${e.total_cost_usd.toFixed(3)}` : ""));
              }
              if (!n) console.log("_ninguna_");
            ' 2>/dev/null || echo "_no se pudo leer el stream_"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Abrir PR con lo que cambió
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MODO: ${{ inputs.modo }}
          SENAL: ${{ inputs.senal }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "La corrida no cambió nada — no hay PR que abrir." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.email noreply@anthropic.com
          git config user.name Claude

          rama="cerebro/${MODO}-${GITHUB_RUN_ID}"
          git checkout -b "$rama"
          git add -A
          git commit -F - <<MSG
          cerebro(${MODO}): corrida disparada desde GitHub

          Señal: ${SENAL}
          Run: ${RUN_URL}
          MSG

          # El checkout no dejó credenciales (persist-credentials: false):
          # el token entra solo en este push, como cabecera de esta llamada.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" \
            push -u origin "$rama"

          body_file=$(mktemp)
          {
            echo "Disparada desde \`workflow_dispatch\` con modo \`$MODO\`."
            echo
            echo "**Señal:** ${SENAL:-_(sin señal)_}"
            echo
            echo "Herramientas invocadas y coste: [resumen de la corrida]($RUN_URL)."
            echo
            echo "---"
            echo "_Generated by [Claude Code](https://claude.ai/code)_"
          } > "$body_file"
          gh pr create --draft \
            --title "cerebro(${MODO}): corrida disparada desde GitHub" \
            --body-file "$body_file"
