name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Fuente ÚNICA de publicación: peaceiris empuja el export a la rama gh-pages.
# Antes había DOS caminos (rama gh-pages + deploy oficial de Actions) más
# `configure-pages enablement:true`, que alternaba la "Source" de Pages en cada
# deploy y dejaba el dominio custom (uapcodex.org) sin verificar → 404
# intermitente (incidente del 26 jun 2026). Con un solo camino, la Source deja
# de saltar. REQUISITO en GitHub: Settings → Pages → Source = "Deploy from a
# branch" → gh-pages / (root).

permissions:
  contents: read

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # peaceiris empuja a la rama gh-pages
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0    # need full history so the version step can
                            # walk back to the last merge commit

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Compute build version. Walks the git history (not just HEAD) for
      # the most recent commit subject that matches either GitHub merge
      # pattern — "title (#NN)" from squash-merge or "Merge pull request
      # #NN" from regular merge. This way a direct push to main (e.g. a
      # docs tweak with no PR) still shows the last release number
      # instead of falling back to a raw SHA.
      - name: Compute build version
        id: ver
        run: |
          PR=$(git log --pretty=%s \
               | grep -oE '(\(#[0-9]+\)$|^Merge pull request #[0-9]+)' \
               | head -1 \
               | grep -oE '[0-9]+' \
               | head -1)
          if [ -n "$PR" ]; then
            echo "version=v$PR" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # base_path vacío: el sitio se sirve desde la raíz del dominio custom
      # (uapcodex.org). No dependemos de configure-pages para esto.
      - name: Build Next.js static export
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_BUILD_VERSION: ${{ steps.ver.outputs.version }}
          # Reporting (Supabase) — claves públicas. Cárgalas en
          # Settings → Secrets and variables → Actions → Variables.
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Add .nojekyll
        run: touch out/.nojekyll

      # Único camino de publicación: rama gh-pages. `cname` reafirma el dominio
      # custom en cada deploy (además del public/CNAME que Next copia al export),
      # para que la verificación del dominio no se pierda.
      - name: Deploy to gh-pages branch (peaceiris)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/out
          publish_branch: gh-pages
          force_orphan: true
          cname: uapcodex.org
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
