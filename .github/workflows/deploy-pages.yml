name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    outputs:
      base_path: ${{ steps.pages.outputs.base_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Compute build version
        id: ver
        run: |
          PR=$(git log -1 --pretty=%s | grep -oE '#[0-9]+' | head -1 | tr -d '#')
          if [ -n "$PR" ]; then
            echo "version=v$PR" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Next.js static export
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_BUILD_VERSION: ${{ steps.ver.outputs.version }}

      - name: Add .nojekyll
        run: touch out/.nojekyll

      # Path 1: push to gh-pages branch (works if Pages source = "Deploy from a branch")
      - name: Deploy to gh-pages branch (peaceiris)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.event.head_commit.message }}"

      # Path 2: upload as Pages artifact (works if Pages source = "GitHub Actions")
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./web/out

  # Deploy via official Pages — only completes if source = "GitHub Actions"
  # If source is "branch", this job errors silently but path 1 above already
  # published the site.
  deploy-official:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    continue-on-error: true
    steps:
      - name: Deploy to GitHub Pages (official)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
