name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Show Pages config detected by action
        run: |
          echo "Pages base_path:  ${{ steps.pages.outputs.base_path }}"
          echo "Pages base_url:   ${{ steps.pages.outputs.base_url }}"
          echo "Pages host:       ${{ steps.pages.outputs.host }}"
          echo "Pages origin:     ${{ steps.pages.outputs.origin }}"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Next.js static export
        run: npm run build
        env:
          NODE_ENV: production
          # Pass the canonical Pages URL into the build so basePath matches exactly
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Debug — what the build actually produced
        run: |
          echo "=== Files in out/ ==="
          ls out/ | head -20
          echo ""
          echo "=== First CSS link reference in out/index.html ==="
          grep -oE 'href="[^"]*\.css[^"]*"' out/index.html | head -3
          echo ""
          echo "=== First few asset paths in out/index.html ==="
          grep -oE 'href="/[^"]*"' out/index.html | head -5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment serves CSS correctly
        run: |
          BASE_URL="${{ steps.deployment.outputs.page_url }}"
          echo "Verifying deploy at: $BASE_URL"
          sleep 15  # Give CDN a moment

          # Fetch the homepage
          HTML=$(curl -sSL "$BASE_URL")
          if [ -z "$HTML" ]; then
            echo "❌ Homepage returned empty body"
            exit 1
          fi

          # Extract the first CSS href
          CSS_HREF=$(echo "$HTML" | grep -oE 'href="[^"]*\.css[^"]*"' | head -1 | sed -E 's/href="([^"]+)"/\1/')
          if [ -z "$CSS_HREF" ]; then
            echo "❌ No CSS link found in homepage HTML"
            echo "First 500 chars of HTML:"
            echo "$HTML" | head -c 500
            exit 1
          fi
          echo "✓ Found CSS href in HTML: $CSS_HREF"

          # Resolve to absolute URL
          if [[ "$CSS_HREF" == /* ]]; then
            HOST=$(echo "$BASE_URL" | grep -oE 'https?://[^/]+')
            CSS_URL="${HOST}${CSS_HREF}"
          else
            CSS_URL="${BASE_URL%/}/${CSS_HREF}"
          fi
          echo "Fetching CSS at: $CSS_URL"

          # Fetch CSS and check status
          CSS_STATUS=$(curl -sSL -o /tmp/css.out -w "%{http_code}" "$CSS_URL")
          CSS_SIZE=$(wc -c < /tmp/css.out)
          echo "CSS HTTP $CSS_STATUS, size $CSS_SIZE bytes"

          if [ "$CSS_STATUS" != "200" ]; then
            echo "❌ CSS did not return 200"
            echo "First 500 chars of response:"
            head -c 500 /tmp/css.out
            exit 1
          fi
          if [ "$CSS_SIZE" -lt 1000 ]; then
            echo "❌ CSS body too small to be real Tailwind output (got $CSS_SIZE bytes)"
            head -c 500 /tmp/css.out
            exit 1
          fi
          if ! grep -q "tailwind" /tmp/css.out; then
            echo "⚠ CSS body doesn't mention 'tailwind' — first 300 chars:"
            head -c 300 /tmp/css.out
          fi
          echo "✅ Deployment verified: HTML + CSS both load from $BASE_URL"
