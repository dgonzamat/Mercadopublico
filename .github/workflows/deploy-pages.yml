name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Detect canonical Pages base path so basePath matches the real URL.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Next.js static export
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Debug — what the build actually produced
        run: |
          echo "=== First CSS href in out/index.html ==="
          grep -oE 'href="[^"]*\.css[^"]*"' out/index.html | head -1
          echo "=== Sample nav hrefs ==="
          grep -oE 'href="/[^"]*"' out/index.html | sort -u | head -8
          echo "=== Pages count ==="
          find out -name 'index.html' | wc -l

      # Push to gh-pages branch — works with "Deploy from a branch" source
      # which is the most reliable / least-fragile Pages config.
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.event.head_commit.message }}"
