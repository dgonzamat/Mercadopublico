name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Mínimo privilegio: cada job declara solo lo que usa (ver permissions por
# job). El default a nivel workflow queda en solo-lectura.
permissions:
  contents: read

concurrency:
  group: "pages-deploy"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # peaceiris empuja a la branch gh-pages
      pages: write      # configure-pages con enablement: true
    defaults:
      run:
        working-directory: ./web
    outputs:
      base_path: ${{ steps.pages.outputs.base_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0    # need full history so the version step can
                            # walk back to the last merge commit

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Compute build version. Walks the git history (not just HEAD) for
      # the most recent commit subject that matches either GitHub merge
      # pattern — "title (#NN)" from squash-merge or "Merge pull request
      # #NN" from regular merge. This way a direct push to main (e.g. a
      # docs tweak with no PR) still shows the last release number
      # instead of falling back to a raw SHA.
      - name: Compute build version
        id: ver
        run: |
          PR=$(git log --pretty=%s \
               | grep -oE '(\(#[0-9]+\)$|^Merge pull request #[0-9]+)' \
               | head -1 \
               | grep -oE '[0-9]+' \
               | head -1)
          if [ -n "$PR" ]; then
            echo "version=v$PR" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi

      # Force base_path empty because the site is served from the apex of
      # a custom domain (uapcodex.org). `actions/configure-pages` only
      # returns the empty base_path once Settings → Pages → Custom domain
      # is filled in by hand — we don't depend on that here.
      - name: Build Next.js static export
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: ''
          NEXT_PUBLIC_BUILD_VERSION: ${{ steps.ver.outputs.version }}

      - name: Add .nojekyll
        run: touch out/.nojekyll

      # Path 1: push to gh-pages branch (works if Pages source = "Deploy from a branch")
      - name: Deploy to gh-pages branch (peaceiris)
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/out
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "deploy: ${{ github.event.head_commit.message }}"

      # Path 2: upload as Pages artifact (works if Pages source = "GitHub Actions")
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./web/out

  # Deploy via official Pages — only completes if source = "GitHub Actions"
  # If source is "branch", this job errors silently but path 1 above already
  # published the site.
  deploy-official:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write      # deploy del artifact
      id-token: write   # OIDC que exige actions/deploy-pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    continue-on-error: true
    steps:
      - name: Deploy to GitHub Pages (official)
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        continue-on-error: true
