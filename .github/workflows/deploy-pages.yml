name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Force Pages source to "GitHub Actions" (build_type=workflow).
      # If source was previously set to "Deploy from a branch", this corrects it
      # so actions/deploy-pages below can take over.
      - name: Force Pages source to GitHub Actions
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}' || true
          curl -sS -X PUT \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/pages \
            -d '{"build_type":"workflow"}' || true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Show Pages config detected by action
        run: |
          echo "Pages base_path:  ${{ steps.pages.outputs.base_path }}"
          echo "Pages origin:     ${{ steps.pages.outputs.origin }}"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Next.js static export
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Debug — what the build actually produced
        run: |
          echo "=== First CSS link reference in out/index.html ==="
          grep -oE 'href="[^"]*\.css[^"]*"' out/index.html | head -3
          echo ""
          echo "=== First nav link hrefs in out/index.html ==="
          grep -oE 'href="/[^"]*"' out/index.html | sort -u | head -10

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment serves CSS correctly
        run: |
          BASE_URL="${{ steps.deployment.outputs.page_url }}"
          echo "Verifying deploy at: $BASE_URL"
          sleep 20

          HTML=$(curl -sSL "$BASE_URL")
          if [ -z "$HTML" ]; then
            echo "::error::Homepage returned empty body"
            exit 1
          fi

          CSS_HREF=$(echo "$HTML" | grep -oE 'href="[^"]*\.css[^"]*"' | head -1 | sed -E 's/href="([^"]+)"/\1/')
          if [ -z "$CSS_HREF" ]; then
            echo "::error::No CSS link found in homepage HTML"
            echo "First 500 chars of HTML:"
            echo "$HTML" | head -c 500
            exit 1
          fi
          echo "✓ HTML references CSS at: $CSS_HREF"

          if [[ "$CSS_HREF" == /* ]]; then
            HOST=$(echo "$BASE_URL" | grep -oE 'https?://[^/]+')
            CSS_URL="${HOST}${CSS_HREF}"
          else
            CSS_URL="${BASE_URL%/}/${CSS_HREF}"
          fi
          echo "Fetching CSS at: $CSS_URL"

          CSS_STATUS=$(curl -sSL -o /tmp/css.out -w "%{http_code}" "$CSS_URL")
          CSS_SIZE=$(wc -c < /tmp/css.out)
          echo "CSS HTTP $CSS_STATUS, $CSS_SIZE bytes"

          if [ "$CSS_STATUS" != "200" ] || [ "$CSS_SIZE" -lt 1000 ]; then
            echo "::error::CSS failed verification (HTTP $CSS_STATUS, $CSS_SIZE bytes)"
            echo "First 500 chars of response:"
            head -c 500 /tmp/css.out
            exit 1
          fi
          echo "✅ Deploy verified at $BASE_URL — CSS loads correctly"
