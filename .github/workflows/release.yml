name: Release

# Publica una GitHub Release cuando se pushea un tag vX.Y.Z.
# Si existe docs/release-notes/<tag>.md usa esas notas curadas; si no, las
# autogenera desde los PRs mergeados. Fully hands-off: taggear = release.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="docs/release-notes/${TAG}.md"
          if [ -f "$NOTES" ]; then
            gh release create "$TAG" --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi
