name: CI

# Validación en cada PR y en ramas de trabajo. Es un "dry-run" del deploy:
# corre exactamente la misma cadena (build-cases → auditoría → next build)
# que deploy-pages.yml, pero SIN publicar. Garantiza que cualquier PR
# — incluidos los que abre la rutina diaria de casos nuevos — pase la
# auditoría de consistencia antes de poder mergearse.

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]   # main ya valida vía deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint (ESLint)
        run: npm run lint

      # Typecheck explícito ANTES del build: `tsc --noEmit` (~7 s) falla rápido
      # y aísla los errores de tipo, en vez de descubrirlos al final de
      # `next build` tras el webpack. Nace de #638, donde un error de resolución
      # (re-export sin binding local) solo se vio tarde en el build de CI —
      # y el tsc local sin node_modules daba falso verde.
      #
      # build-cases + build-posts se corren primero porque lib/data.ts,
      # dataClient.ts, siteStats.ts y posts.ts importan JSON agregados
      # (cases.json, cases-client.json, site-stats.json, posts.json) que son
      # gitignored —los genera el prebuild—; sin ellos tsc no resuelve esos
      # imports de módulo. El `npm run build` de abajo los regenera (idempotente).
      - name: Typecheck (tsc --noEmit)
        run: |
          node scripts/build-cases.mjs
          node scripts/build-posts.mjs
          npm run typecheck

      # `npm run build` encadena el prebuild (build-cases + audit-consistency)
      # y luego next build. Si los JSON de casos están rotos, si hay drift
      # numérico/textual (auditoría E1–E6), o si falla el type-check, este
      # paso falla y el PR no es mergeable.
      - name: Validate (build-cases → audit → next build)
        run: npm run build
        env:
          NODE_ENV: production
