name: Android APK

# Compila el APK del limpiador (android-cleaner/) y lo publica como artifact.
# Independiente del CI del sitio (ci.yml trabaja solo en web/).

on:
  push:
    paths:
      - "android-cleaner/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    paths:
      - "android-cleaner/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "android-apk-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android-cleaner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: limpiador-apk
          path: android-cleaner/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
