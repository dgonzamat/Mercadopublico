name: Weekly Audit

# Auditoría semanal independiente del flujo de PRs. Corre `npm run audit`
# sobre el corpus actual de `main`. Si encuentra ERRORS (drift numérico,
# frases prohibidas, evidenceContribution rota, JSON inválido), abre un
# GitHub issue con el reporte completo.
#
# Por qué existe: la auditoría que ya corre en deploy (deploy-pages.yml)
# y en PRs (ci.yml) solo se dispara cuando alguien empuja código. Esta
# corrida detecta drift que entró por commits manuales o renames a
# medias, sin depender de que haya actividad esa semana.
#
# Por qué SEMANAL y no diaria (ago 2026): las tres cosas que este workflow
# vigila —drift de consistencia, link rot externo, framing de DVIDS—
# cambian a escala de semanas, no de horas. Corriendo a diario, el gate de
# link rot marcaba el run como fallido casi todos los días apenas
# cualquiera de las miles de citas del corpus se pudría, generando un
# email de "All jobs have failed" que dejó de ser señal y pasó a ser
# ruido — el mismo antipatrón de fatiga de alerta que ya forzó a
# consolidar el issue de link rot en uno persistente (ver más abajo).
# Semanal conserva la detección con una décima parte del ruido.

on:
  schedule:
    - cron: '0 7 * * 1'    # semanal, lunes 07:00 UTC
  workflow_dispatch:       # también disparable a mano desde la UI

permissions:
  contents: read
  issues: write            # para abrir el issue cuando falla

concurrency:
  group: "weekly-audit"
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Captura todo el output a un archivo y al log a la vez. `audit`
      # falla con exit 1 si hay ERRORS; usamos `|| true` para no abortar
      # el job y poder abrir el issue con el reporte abajo.
      - name: Run consistency audit
        id: audit
        run: |
          set +e
          npm run audit 2>&1 | tee /tmp/audit.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Gate de link rot. Necesita red, así que no puede vivir en el prebuild
      # (las sondas de build son node-plain y offline). Compara contra la
      # línea base congelada y solo falla con roturas NUEVAS — el corpus
      # arrastra decenas de citas ya muertas y un check binario sería rojo
      # permanente. Sin este paso las fuentes se pudrían en silencio.
      - name: Check source link rot
        id: links
        run: |
          set +e
          npm run check-links:gate 2>&1 | tee /tmp/links.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # Contraparte viva del ÚNICO origen de tercero que admite el visor
      # (el player de DVIDS, para los videos PURSUE que no caben rehosteados).
      # E17/E20 verifican los otros dos orígenes offline contra disco y
      # manifiesto; un iframe a dvidshub.net no se puede verificar sin red.
      # Vigila el modo de falla SILENCIOSO: si DVIDS empieza a mandar
      # x-frame-options, el iframe queda en blanco y el build sigue verde.
      - name: Check DVIDS embeds still framable
        id: dvids
        run: |
          set +e
          npm run check-dvids 2>&1 | tee /tmp/dvids.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Open issue on broken DVIDS embeds
        if: steps.dvids.outputs.exit_code != '0'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/dvids.log', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            const MARKER = '<!-- dvids-embed-gate -->';
            const body = [
              MARKER,
              'Uno o más videos de DVIDS embebidos en el visor **dejaron de ser embebibles**.',
              '',
              `Última corrida: **${today}**`,
              '',
              'Es el riesgo asumido al admitir un origen de tercero: DVIDS puede cambiar su política de framing unilateralmente y el iframe queda en blanco sin romper el build. Ruta: revisar si apareció una rendition que quepa en el bucket Supabase para rehostear, o degradar el documento a enlace en `sources`.',
              '',
              '<details><summary>Reporte completo</summary>',
              '',
              '```',
              report.slice(-6000),
              '```',
              '',
              '</details>',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            // Issue persistente, mismo patrón que el gate de link rot: se
            // actualiza en vez de acumular uno por corrida.
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'audit',
              per_page: 100,
            });
            const existing = open.find((i) => (i.body || '').includes(MARKER));
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title: `dvids: embeds de video rotos (actualizado ${today})`,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `dvids: embeds de video rotos (actualizado ${today})`,
                body,
                labels: ['audit', 'automated'],
              });
            }

      # Un issue PERSISTENTE, no uno por corrida. Antes cada corrida abría
      # uno nuevo: a agosto 2026 había 82 issues automáticas abiertas y el
      # gate se había vuelto ruido de fondo — exactamente el fracaso que su
      # diseño (línea base + solo roturas nuevas) buscaba evitar. Ahora
      # busca el issue abierto con el marcador y lo ACTUALIZA; solo abre
      # uno si no existe. Un hilo con historial se lee; 82 hilos idénticos
      # no.
      - name: Report new link rot (single persistent issue)
        if: steps.links.outputs.exit_code != '0'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/links.log', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            const MARKER = '<!-- link-rot-gate -->';
            const body = [
              MARKER,
              'El gate de link rot encontró fuentes rotas **nuevas** (no estaban en la línea base).',
              '',
              `Última corrida: **${today}**`,
              '',
              'La propuesta del sitio es evidencia con fuentes primarias verificables, así que una cita muerta erosiona justo eso. Ruta: mover a Wayback (`web.archive.org/web/<url>`) conservando la URL original en `note` — no borrar la cita.',
              '',
              'Los `401/403/406/429` NO son link rot (muro de pago o bloqueo de bot) y no entran a este gate.',
              '',
              '<details><summary>Reporte completo</summary>',
              '',
              '```',
              report.slice(-6000),
              '```',
              '',
              '</details>',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');

            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'audit',
              per_page: 100,
            });
            const existing = open.find((i) => (i.body || '').includes(MARKER));

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                title: `link rot: fuentes rotas nuevas (actualizado ${today})`,
                body,
              });
              core.info(`Actualizado issue #${existing.number}`);
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `link rot: fuentes rotas nuevas (actualizado ${today})`,
                body,
                labels: ['audit', 'automated'],
              });
            }

      # Cuando el gate vuelve a verde, cierra el issue persistente en vez de
      # dejarlo abierto para siempre. Sin esto el hilo único tendría el mismo
      # problema que los 82: nadie sabe si sigue vigente.
      - name: Close link rot issue when green
        if: steps.links.outputs.exit_code == '0'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const MARKER = '<!-- link-rot-gate -->';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'audit',
              per_page: 100,
            });
            const existing = open.find((i) => (i.body || '').includes(MARKER));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Gate en verde el ${new Date().toISOString().slice(0, 10)}: sin roturas nuevas sobre la línea base. Cerrando.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
            }

      # Si la auditoría falla, abre (o reusa) un issue con el reporte.
      # Se usa el script de GitHub Actions oficial para no agregar deps.
      - name: Open issue on drift
        if: steps.audit.outputs.exit_code != '0'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/audit.log', 'utf8');
            const today = new Date().toISOString().slice(0, 10);
            const title = `audit: drift detectado (${today})`;
            const body = [
              'La auditoría semanal encontró inconsistencias en `main`.',
              '',
              '<details><summary>Reporte completo</summary>',
              '',
              '```',
              report.slice(-6000),  // últimas ~6KB del reporte
              '```',
              '',
              '</details>',
              '',
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['audit', 'automated'],
            });

      - name: Fail the job if drift
        if: steps.audit.outputs.exit_code != '0' || steps.links.outputs.exit_code != '0'
        run: exit 1
